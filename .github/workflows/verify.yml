name: Verify OncoMosaic
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r inference/requirements.txt
      - run: python -m pytest inference/tests -q
      - run: dotnet test backend/OncoMosaic.Tests
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/verify_e2e.py --faults
      - run: python scripts/verify_comparison.py
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
        env: {PW_CHANNEL: chromium}
      - run: python scripts/verify_ki67_exports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/*.png
            docs/api-verification.json
            docs/comparison-verification.json
            docs/ki67-verification.json
            frontend/test-results/
      - run: docker compose logs --no-color > compose-test.log && docker compose down
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: container-logs, path: compose-test.log}
